name: Build
on:
  # Lets not go crazy just yet.
  # push:
  #   branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Downloads and caches the Opus DNN weights archive once, before any of
  # the dnn=yes build jobs start, so they all restore from cache instead of
  # racing to download it independently.
  fetch-dnn-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Opus DNN weights archive
        id: cache
        uses: actions/cache@v4
        with:
          path: third-party/opus/dnn/opus_data-*.tar.gz
          key: opus-dnn-weights-${{ hashFiles('third-party/opus/autogen.sh') }}

      - name: Download Opus DNN weights
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          model_hash=$(grep -oP 'download_model\.sh\s+"\K[0-9a-f]+' third-party/opus/autogen.sh)
          mkdir -p third-party/opus/dnn
          archive="third-party/opus/dnn/opus_data-${model_hash}.tar.gz"
          url="https://media.xiph.org/opus/models/opus_data-${model_hash}.tar.gz"
          echo "Downloading $url"
          curl -fL -o "$archive" "$url"
          echo "${model_hash}  ${archive}" | sha256sum -c --strict -

  build:
    needs: fetch-dnn-weights
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            dnn: "no"
          - os: windows-latest
            platform: windows
            dnn: "yes"
          - os: ubuntu-latest
            platform: linux
            dnn: "no"
          - os: ubuntu-latest
            platform: linux
            dnn: "yes"
          - os: macos-latest
            platform: macos
            dnn: "no"
          - os: macos-latest
            platform: macos
            dnn: "yes"
    runs-on: ${{ matrix.os }}
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons_cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install scons

      - name: Cache SCons build
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-dnn${{ matrix.dnn }}-${{ hashFiles('src/**', 'third-party/opus/**', 'third-party/speexdsp/**', 'SConstruct') }}
          restore-keys: |
            scons-${{ matrix.platform }}-dnn${{ matrix.dnn }}-

      # Restores the archive fetch-dnn-weights already downloaded.
      - name: Restore Opus DNN weights archive
        if: matrix.dnn == 'yes'
        uses: actions/cache@v4
        with:
          path: third-party/opus/dnn/opus_data-*.tar.gz
          key: opus-dnn-weights-${{ hashFiles('third-party/opus/autogen.sh') }}

      - name: Build Debug
        run: scons platform=${{ matrix.platform }} target=template_debug dnn=${{ matrix.dnn }}

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: godotopus-${{ matrix.platform }}-dnn${{ matrix.dnn }}
          path: build/addons/godotopus/bin
          if-no-files-found: error
