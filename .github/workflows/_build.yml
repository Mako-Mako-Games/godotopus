# Reusable build: fetches the Opus DNN weights once, builds every platform in
# both flavors (dnn=no / dnn=yes) and runs the native tests, then runs the
# gdUnit4 suite in Godot against each build. Called by ci.yml and release.yml
# so releases ship exactly what CI tested.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref).
        type: string
        default: ""
      targets:
        description: Space-separated Godot build targets.
        type: string
        default: template_debug

env:
  # Lowest supported Godot version; the Godot tests run against it.
  GODOT_VERSION: 4.5-stable
  GODOTOPUS_DNN_CACHE: build/cache/opus_dnn

jobs:
  fetch-dnn-weights:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Compute cache key
        id: key
        run: echo "key=opus-dnn-weights-${{ hashFiles('third-party/opus/autogen.sh') }}" >> "$GITHUB_OUTPUT"

      # Saved from Linux but restored on every OS; cache entries are OS-specific
      # unless enableCrossOsArchive is set on both the save and the restores.
      - name: Cache Opus DNN weights archive
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOTOPUS_DNN_CACHE }}
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: Download Opus DNN weights
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          model_hash=$(grep -oP 'download_model\.sh\s+"\K[0-9a-f]+' third-party/opus/autogen.sh)
          mkdir -p "$GODOTOPUS_DNN_CACHE"
          archive="$GODOTOPUS_DNN_CACHE/opus_data-${model_hash}.tar.gz"
          curl -fL --retry 3 -o "$archive" "https://media.xiph.org/opus/models/opus_data-${model_hash}.tar.gz"
          echo "${model_hash}  ${archive}" | sha256sum -c --strict -

  build:
    needs: fetch-dnn-weights
    name: build (${{ matrix.platform }}, dnn=${{ matrix.dnn }})
    strategy:
      fail-fast: false
      matrix:
        # To add a platform: one entry per flavor here and in godot-tests,
        # plus one [libraries] line in addons/godotopus/godotopus.gdextension.
        include:
          - { os: windows-latest, platform: windows, dnn: "no" }
          - { os: windows-latest, platform: windows, dnn: "yes" }
          # Oldest supported Ubuntu runner, so binaries load on older glibc.
          - { os: ubuntu-22.04, platform: linux, dnn: "no" }
          - { os: ubuntu-22.04, platform: linux, dnn: "yes" }
          - { os: macos-latest, platform: macos, dnn: "no" }
          - { os: macos-latest, platform: macos, dnn: "yes" }
    runs-on: ${{ matrix.os }}
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons_cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install scons==4.9.1

      - name: Cache SCons objects
        uses: actions/cache@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-dnn${{ matrix.dnn }}-${{ github.sha }}
          restore-keys: scons-${{ matrix.platform }}-dnn${{ matrix.dnn }}-

      - name: Restore Opus DNN weights archive
        if: matrix.dnn == 'yes'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GODOTOPUS_DNN_CACHE }}
          key: ${{ needs.fetch-dnn-weights.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ inputs.targets }}; do
            scons -j4 platform=${{ matrix.platform }} target=$target dnn=${{ matrix.dnn }}
          done

      - name: Native tests
        run: scons -j4 platform=${{ matrix.platform }} target=template_debug dnn=${{ matrix.dnn }} tests

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}-dnn-${{ matrix.dnn }}
          path: addons/godotopus/bin
          if-no-files-found: error

  # Native tests again under AddressSanitizer + UBSan. Linux only: it's the
  # one platform with first-class sanitizer support in GCC.
  sanitizers:
    needs: fetch-dnn-weights
    name: sanitizers (linux, dnn=${{ matrix.dnn }})
    strategy:
      fail-fast: false
      matrix:
        dnn: ["no", "yes"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install scons==4.9.1

      - name: Restore Opus DNN weights archive
        if: matrix.dnn == 'yes'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GODOTOPUS_DNN_CACHE }}
          key: ${{ needs.fetch-dnn-weights.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Native tests with sanitizers
        run: scons -j4 platform=linux target=template_debug dnn=${{ matrix.dnn }} sanitize=yes tests

  godot-tests:
    needs: build
    name: godot tests (${{ matrix.platform }}, dnn=${{ matrix.dnn }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, dnn: "no", godot: "win64.exe.zip", exe: "Godot_v${GODOT_VERSION}_win64_console.exe" }
          - { os: windows-latest, platform: windows, dnn: "yes", godot: "win64.exe.zip", exe: "Godot_v${GODOT_VERSION}_win64_console.exe" }
          - { os: ubuntu-22.04, platform: linux, dnn: "no", godot: "linux.x86_64.zip", exe: "Godot_v${GODOT_VERSION}_linux.x86_64" }
          - { os: ubuntu-22.04, platform: linux, dnn: "yes", godot: "linux.x86_64.zip", exe: "Godot_v${GODOT_VERSION}_linux.x86_64" }
          - { os: macos-latest, platform: macos, dnn: "no", godot: "macos.universal.zip", exe: "Godot.app/Contents/MacOS/Godot" }
          - { os: macos-latest, platform: macos, dnn: "yes", godot: "macos.universal.zip", exe: "Godot.app/Contents/MacOS/Godot" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: bin-${{ matrix.platform }}-dnn-${{ matrix.dnn }}
          path: addons/godotopus/bin

      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_${{ matrix.godot }}"
          unzip -q godot.zip -d godot-bin
          godot="$GITHUB_WORKSPACE/godot-bin/${{ matrix.exe }}"
          chmod +x "$godot" || true
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"

      - name: Install addon and gdUnit4 into the test project
        shell: bash
        run: |
          mkdir -p tests/godot/addons
          cp -r addons/godotopus tests/godot/addons/
          python tools/fetch_gdunit4.py

      - name: Run Godot tests
        run: python tools/run_godot_tests.py

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: godot-test-report-${{ matrix.platform }}-dnn-${{ matrix.dnn }}
          path: tests/godot/reports
