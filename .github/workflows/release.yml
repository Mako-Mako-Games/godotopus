name: Draft Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            dnn: "no"
          - os: windows-latest
            platform: windows
            dnn: "yes"
          - os: ubuntu-latest
            platform: linux
            dnn: "no"
          - os: ubuntu-latest
            platform: linux
            dnn: "yes"
          - os: macos-latest
            platform: macos
            dnn: "no"
          - os: macos-latest
            platform: macos
            dnn: "yes"
    runs-on: ${{ matrix.os }}
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons_cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install scons

      - name: Cache SCons build
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-dnn${{ matrix.dnn }}-${{ hashFiles('src/**', 'third-party/opus/**', 'third-party/speexdsp/**', 'SConstruct') }}-v2
          restore-keys: |
            scons-${{ matrix.platform }}-dnn${{ matrix.dnn }}-

      - name: Build Debug
        run: scons platform=${{ matrix.platform }} target=template_debug dnn=${{ matrix.dnn }}

      - name: Build Release
        run: scons platform=${{ matrix.platform }} target=template_release dnn=${{ matrix.dnn }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-dnn${{ matrix.dnn }}-bin
          path: build/addons/godotopus/bin
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/addons
          cp -r addon package/addons/godotopus
          mkdir -p package/addons/godotopus/bin
          # Copy per-platform, per-dnn-variant artifact folders into the same
          # bin/ dir. This is safe because SConstruct gives the dnn=yes
          # binaries their own filename (libgodotopus.dnn.*), so the no/yes
          # variants for a given platform never collide with each other, and
          # different platforms never collide since they use different
          # SHLIBSUFFIX/suffix combos.
          for dir in artifacts/*/; do
            artifact_name=$(basename "$dir")
            cp -r "$dir"/* package/addons/godotopus/bin/
            echo "Copied $artifact_name binaries"
          done
          echo "Final bin contents:"
          ls -la package/addons/godotopus/bin

      - name: Create ZIP
        run: |
          cd package
          zip -r ../godotopus-${{ inputs.tag }}.zip addons

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          files: godotopus-${{ inputs.tag }}.zip
