name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0). Must match the version in addons/godotopus/plugin.cfg.
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Tag matches plugin.cfg version
        run: |
          version=$(sed -n 's/^version="\(.*\)"/\1/p' addons/godotopus/plugin.cfg)
          if [ "v$version" != "${{ inputs.tag }}" ]; then
            echo "::error::Tag ${{ inputs.tag }} does not match plugin.cfg version $version"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/_build.yml
    with:
      ref: ${{ inputs.tag }}
      targets: template_debug template_release

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble addon zips
        run: |
          set -euo pipefail
          assemble() {
            local flavor=$1 zip=$2
            local root="package-$flavor"
            mkdir -p "$root/addons"
            cp -r addons/godotopus "$root/addons/godotopus"
            mkdir -p "$root/addons/godotopus/bin"
            for dir in artifacts/bin-*-dnn-$flavor/; do
              cp -r "$dir"/* "$root/addons/godotopus/bin/"
            done
            # Import libraries and debug symbols are build by-products, not runtime files.
            find "$root/addons/godotopus/bin" \( -name '*.a' -o -name '*.lib' -o -name '*.exp' -o -name '*.pdb' \) -delete
            ls -la "$root/addons/godotopus/bin"
            (cd "$root" && zip -qr "../$zip" addons)
          }
          assemble yes "godotopus-${{ inputs.tag }}.zip"
          assemble no "godotopus-${{ inputs.tag }}-no-dnn.zip"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            godotopus-${{ inputs.tag }}.zip
            godotopus-${{ inputs.tag }}-no-dnn.zip
