name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows

          - os: ubuntu-latest
            platform: linux

          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install scons

      - run: scons platform=${{ matrix.platform }} target=template_debug

      - run: scons platform=${{ matrix.platform }} target=template_release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bin
          path: build/addons/godotopus/bin

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble addon
        shell: bash
        run: |
          mkdir -p package/addons/godotopus

          cp addon/godotopus.gdextension package/addons/godotopus/
          cp -r addon/scripts package/addons/godotopus/

          mkdir package/addons/godotopus/bin

          find artifacts -type f -exec cp {} package/addons/godotopus/bin/ \;

      - name: Create ZIP
        run: |
          cd package
          zip -r ../godotopus-${{ inputs.tag }}.zip addons

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          files: godotopus-${{ inputs.tag }}.zip
