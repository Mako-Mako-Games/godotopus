name: Draft Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            dnn: "no"
          - os: windows-latest
            platform: windows
            dnn: "yes"
          - os: ubuntu-latest
            platform: linux
            dnn: "no"
          - os: ubuntu-latest
            platform: linux
            dnn: "yes"
          - os: macos-latest
            platform: macos
            dnn: "no"
          - os: macos-latest
            platform: macos
            dnn: "yes"
    runs-on: ${{ matrix.os }}
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons_cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install scons

      - name: Cache SCons build
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-dnn${{ matrix.dnn }}-${{ hashFiles('src/**', 'third-party/opus/**', 'third-party/speexdsp/**', 'SConstruct') }}-v2
          restore-keys: |
            scons-${{ matrix.platform }}-dnn${{ matrix.dnn }}-

      - name: Build Debug
        run: scons platform=${{ matrix.platform }} target=template_debug dnn=${{ matrix.dnn }}

      - name: Build Release
        run: scons platform=${{ matrix.platform }} target=template_release dnn=${{ matrix.dnn }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-dnn${{ matrix.dnn }}-bin
          path: build/addons/godotopus/bin
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble no-dnn addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-no-dnn/addons
          cp -r addon package-no-dnn/addons/godotopus
          mkdir -p package-no-dnn/addons/godotopus/bin
          for dir in artifacts/*-dnnno-bin/; do
            artifact_name=$(basename "$dir")
            cp -r "$dir"/* package-no-dnn/addons/godotopus/bin/
            echo "Copied $artifact_name binaries"
          done
          echo "Final no-dnn bin contents:"
          ls -la package-no-dnn/addons/godotopus/bin

      - name: Assemble dnn addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-dnn/addons
          cp -r addon package-dnn/addons/godotopus
          mkdir -p package-dnn/addons/godotopus/bin
          for dir in artifacts/*-dnnyes-bin/; do
            artifact_name=$(basename "$dir")
            cp -r "$dir"/* package-dnn/addons/godotopus/bin/
            echo "Copied $artifact_name binaries"
          done
          echo "Final dnn bin contents:"
          ls -la package-dnn/addons/godotopus/bin

      - name: Create ZIPs
        run: |
          (cd package-no-dnn && zip -r ../godotopus-${{ inputs.tag }}-no-dnn.zip addons)
          (cd package-dnn && zip -r ../godotopus-${{ inputs.tag }}.zip addons)

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            godotopus-${{ inputs.tag }}.zip
            godotopus-${{ inputs.tag }}-no-dnn.zip
